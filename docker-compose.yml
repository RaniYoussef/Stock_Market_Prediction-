
services:
  db:
    image: postgres:13
    container_name: money_money_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nowara
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: money_money_web
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && rails db:create db:migrate && rails server -b 0.0.0.0 -p 3000"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nowara
      POSTGRES_HOST: db

volumes:
  postgres_data:
